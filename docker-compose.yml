services:
  swim-academy:
    build: .
    container_name: swim-academy
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - ./data:/data
    environment:
      ENVIRONMENT: dev
      OTP_IN_RESPONSE: "true"
    networks:
      - swim-net
    restart: unless-stopped

networks:
  swim-net:
    name: swim-academy-net
    driver: bridge
