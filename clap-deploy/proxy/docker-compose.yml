# Shared TLS reverse proxy for clap. Only this stack publishes ports.
# Apps join the "web" network and are reached by container name.
services:
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 256

volumes:
  caddy-data:
  caddy-config:

networks:
  web:
    name: web
