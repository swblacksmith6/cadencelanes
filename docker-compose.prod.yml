# Production stack. No ports are published: the shared Caddy proxy reaches
# the app over the external "web" network (see the proxy stack on the server).
# Secrets come from a .env file next to this one (JWT_SECRET is required).
services:
  cadencelanes:
    build: .
    image: cadencelanes:latest
    container_name: cadencelanes
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:?set MSG91_AUTH_KEY in .env}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:?set MSG91_OTP_TEMPLATE_ID in .env}
      SMS_APP_NAME: ${SMS_APP_NAME:-CadenceLanes}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-9999999999}
    volumes:
      - cadencelanes-data:/data
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256

volumes:
  cadencelanes-data:

networks:
  web:
    external: true
